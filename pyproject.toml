[project]
name = "zenflow-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "apscheduler==3.11.0",
    "bcrypt==5.0.0",
    "flask==3.1.3",
    "flask-compress==1.25",
    "flask-cors==6.0.5",
    "flask-jwt-extended==4.7.4",
    "pymongo==4.18.2",
    "pypdf2==3.0.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "sentry-sdk==2.71.0",
    "waitress==3.0.2",
]

# Quality-gate configuration: ruff (lint/format) + mypy (type checking).
# Run: ruff check app tests run.py   |   mypy   (both configured here)

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes basics · I: import sorting ·
# UP: py313 modernisation · B: bugbear (real footguns) · C4: comprehensions
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
check_untyped_defs = true
ignore_missing_imports = true      # flask-* extensions lack stubs in places
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
