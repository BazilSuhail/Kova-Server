# Local stack for Kova Server: the API + MongoDB.
#
#   docker compose up --build      # start (http://localhost:5000)
#   docker compose down            # stop  (add -v to wipe the Mongo volume)
#
# Override any value with a local .env file (see .env.example).

name: kova

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    image: kova-server:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      KOVA_ENV: ${KOVA_ENV:-development}
      PORT: ${PORT:-5000}
      KOVA_MONGO_URI: mongodb://mongo:27017/kova
      KOVA_JWT_SECRET: ${KOVA_JWT_SECRET:-local-dev-secret-change-me-at-least-32-chars}
      KOVA_CORS_ORIGINS: ${KOVA_CORS_ORIGINS:-*}
      # Optional integrations — leave blank to keep AI endpoints returning 503.
      KOVA_GROQ_API_KEY: ${KOVA_GROQ_API_KEY:-}
      KOVA_ASSEMBLYAI_API_KEY: ${KOVA_ASSEMBLYAI_API_KEY:-}
      KOVA_OCR_API_KEY: ${KOVA_OCR_API_KEY:-}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"

volumes:
  mongo-data:
