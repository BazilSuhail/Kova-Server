  <!-- Eyes -->
  <ellipse cx="110" cy="100" rx="7" ry="6" fill="#F5EEFF"/>
  <ellipse cx="146" cy="100" rx="7" ry="6" fill="#F5EEFF"/>
  <circle cx="112" cy="101" r="3" fill="#3B1F6E"/>
  <circle cx="148" cy="101" r="3" fill="#3B1F6E"/>

  <!-- Armor plates (gold) -->
  <rect x="92" y="168" width="72" height="8" rx="3" fill="#F2C94C"/>
  <rect x="92" y="180" width="72" height="8" rx="3" fill="#F2C94C"/>
  <rect x="92" y="192" width="72" height="8" rx="3" fill="#F2C94C"/>

  <!-- Plate lacing (deep purple) -->
  <line x1="104" y1="168" x2="104" y2="200" stroke="#4A2E85" stroke-width="2"/>
  <line x1="128" y1="168" x2="128" y2="200" stroke="#4A2E85" stroke-width="2"/>
  <line x1="152" y1="168" x2="152" y2="200" stroke="#4A2E85" stroke-width="2"/>

  <!-- Shoulder guards (sode) -->
  <path d="M48 178c8-8 20-10 30-6l-4 22c-10-4-20-4-26-2z" fill="#9B7DD6"/>
  <path d="M208 178c-8-8-20-10-30-6l4 22c10-4 20-4 26-2z" fill="#9B7DD6"/>
  <path d="M52 186c6-4 14-5 22-3" stroke="#F2C94C" stroke-width="2" fill="none"/>
  <path d="M204 186c-6-4-14-5-22-3" stroke="#F2C94C" stroke-width="2" fill="none"/>

  <!-- Katana across back -->
  <line x1="178" y1="152" x2="220" y2="76" stroke="#EDE6F7" stroke-width="5" stroke-linecap="round"/>
  <line x1="178" y1="152" x2="184" y2="142" stroke="#4A2E85" stroke-width="9" stroke-linecap="round"/>
  <circle cx="220" cy="76" r="4" fill="#F2C94C"/>

  <!-- Belt / obi -->
  <rect x="90" y="160" width="76" height="6" rx="3" fill="#4A2E85"/>
