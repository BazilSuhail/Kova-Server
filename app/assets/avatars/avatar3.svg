<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Samurai avatar">
  <rect width="256" height="256" rx="48" fill="#123F36"/>

  <!-- Body / armor (mid purple) -->
  <path d="M46 234c0-45 37-70 82-70s82 25 82 70z" fill="#7C5CBF"/>

  <!-- Head -->
  <circle cx="128" cy="98" r="42" fill="#7C5CBF"/>

  <!-- Helmet (kabuto) dome -->
  <path d="M86 92c0-32 19-54 42-54s42 22 42 54c0-9-6-16-14-18 4-11 2-21-6-27-6 8-14 12-22 12s-16-4-22-12c-8 6-10 16-6 27-8 2-14 9-14 18z" fill="#9B7DD6"/>

  <!-- Helmet ridge highlight -->
  <path d="M128 40c14 4 26 22 28 44-6-10-16-18-28-20-12 2-22 10-28 20 2-22 14-40 28-44z" fill="#B9A0E8"/>

  <!-- Helmet crest (maedate) -->
  <path d="M118 42l10-18 10 18-10 5z" fill="#F2C94C"/>

  <!-- Face mask (menpo) -->
