    <line x1="128" y1="98" x2="128" y2="56"/>
    <line x1="128" y1="98" x2="98" y2="68"/>
    <line x1="128" y1="98" x2="158" y2="68"/>
    <line x1="128" y1="98" x2="86" y2="98"/>
    <line x1="128" y1="98" x2="170" y2="98"/>
    <line x1="128" y1="98" x2="98" y2="128"/>
    <line x1="128" y1="98" x2="158" y2="128"/>
    <line x1="128" y1="98" x2="112" y2="136"/>
    <line x1="128" y1="98" x2="144" y2="136"/>
  </g>

  <!-- Web arcs -->
  <g stroke="#7A1F17" stroke-width="1.5" fill="none" opacity="0.7">
    <circle cx="128" cy="98" r="14"/>
    <circle cx="128" cy="98" r="24"/>
    <circle cx="128" cy="98" r="34"/>
