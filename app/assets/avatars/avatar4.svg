  <path d="M46 234c2-30 20-50 44-58-6 16-10 36-10 58z" fill="#1F3A93" opacity="0.85"/>
  <path d="M210 234c-2-30-20-50-44-58 6 16 10 36 10 58z" fill="#1F3A93" opacity="0.85"/>

