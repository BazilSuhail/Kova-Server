  <!-- Eye shapes (large white lenses with black outline) -->
  <path d="M96 96c4-10 14-16 22-14 6 2 8 8 6 14-2 8-10 14-18 12-8-2-12-6-10-12z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M160 96c-4-10-14-16-22-14-6 2-8 8-6 14 2 8 10 14 18 12 8-2 12-6 10-12z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Eye inner glow -->
  <ellipse cx="112" cy="94" rx="3" ry="2" fill="#DDE6F5"/>
  <ellipse cx="144" cy="94" rx="3" ry="2" fill="#DDE6F5"/>

  <!-- Chest web pattern -->
  <g stroke="#7A1F17" stroke-width="1.5" fill="none" opacity="0.6">
    <line x1="128" y1="170" x2="128" y2="234"/>
    <line x1="128" y1="170" x2="94" y2="234"/>
    <line x1="128" y1="170" x2="162" y2="234"/>
    <line x1="128" y1="170" x2="76" y2="212"/>
    <line x1="128" y1="170" x2="180" y2="212"/>
