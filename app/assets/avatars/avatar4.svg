    <path d="M128 190l-6-4 2-2 5 3z"/>
    <path d="M128 190l6-4-2-2-5 3z"/>
    <path d="M128 194l-7 3 1 2 6-3z"/>
    <path d="M128 194l7 3-1 2-6-3z"/>
    <path d="M128 200l-5 5 2 1 4-4z"/>
    <path d="M128 200l5 5-2 1-4-4z"/>
