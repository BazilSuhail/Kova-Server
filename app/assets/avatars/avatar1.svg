<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Ninja avatar">
  <rect width="256" height="256" rx="48" fill="#123F36"/>

  <!-- Ninja body / outfit -->
  <path d="M46 234c0-45 37-70 82-70s82 25 82 70z" fill="#8B3A2E"/>

  <!-- Ninja head -->
  <circle cx="128" cy="98" r="42" fill="#8B3A2E"/>

  <!-- Ninja mask (lower face covering) -->
