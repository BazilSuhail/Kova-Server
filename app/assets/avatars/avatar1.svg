  <!-- Eyes -->
  <ellipse cx="108" cy="99" rx="8" ry="7" fill="#F5D9A8"/>
  <ellipse cx="148" cy="99" rx="8" ry="7" fill="#F5D9A8"/>

  <!-- Eye pupils -->
  <circle cx="110" cy="100" r="3.5" fill="#3A1410"/>
  <circle cx="150" cy="100" r="3.5" fill="#3A1410"/>

  <!-- Headband -->
  <rect x="84" y="72" width="88" height="14" rx="4" fill="#D4A24C"/>

  <!-- Headband knot tails -->
  <path d="M172 76l18-8-4 12 16 6-18 2z" fill="#D4A24C"/>

  <!-- Headband metal plate -->
  <rect x="114" y="74" width="28" height="10" rx="2" fill="#E8C988"/>
  <circle cx="128" cy="79" r="3" fill="#8B3A2E"/>

  <!-- Sword on back -->
  <line x1="170" y1="155" x2="210" y2="80" stroke="#C9B896" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="155" x2="175" y2="145" stroke="#A89570" stroke-width="10" stroke-linecap="round"/>
  <circle cx="210" cy="80" r="4" fill="#E8DCC0"/>

  <!-- Sword hilt wrap -->
  <line x1="172" y1="150" x2="182" y2="132" stroke="#6B2A20" stroke-width="5" stroke-linecap="round"/>

  <!-- Belt / sash -->
